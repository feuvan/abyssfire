; Abyssfire - device profiles (ue58-platform.md 6.2, 6.8). abyss.Quality: 0 = low (blob shadows only, FXAA / MSAA 2x),
; 1 = balanced (blob + 1 CSM cascade 1024), 2 = high (blob + 2 cascades 2048). Child profiles (GPU-family Android
; profiles, individual iPhones / iPads) inherit these through BaseProfileName.

[Android_Low DeviceProfile]
+CVars=abyss.Quality=0
+CVars=r.Shadow.CSM.MaxMobileCascades=0
+CVars=r.MSAACount=2
+CVars=t.MaxFPS=30

[Android_Mid DeviceProfile]
+CVars=abyss.Quality=1
+CVars=r.Shadow.CSM.MaxMobileCascades=1
+CVars=r.Shadow.MaxCSMResolution=1024
+CVars=t.MaxFPS=60

[Android_High DeviceProfile]
+CVars=abyss.Quality=2
+CVars=r.Shadow.CSM.MaxMobileCascades=2
+CVars=r.Shadow.MaxCSMResolution=2048
+CVars=t.MaxFPS=60

[IOS DeviceProfile]
+CVars=abyss.Quality=1
+CVars=r.Shadow.CSM.MaxMobileCascades=1
+CVars=r.Shadow.MaxCSMResolution=1024

