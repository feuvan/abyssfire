; Abyssfire - device profiles (ue58-platform.md 6.2, 6.8; shadows per DECISIONS P10, which is binding over the spec's
; 1 / 2 mobile cascades). abyss.Quality: 0 = low (blob shadows only, FXAA / MSAA 2x), 1 = balanced (blob shadows only on
; mobile), 2 = high (sun CSM, 1 cascade 2048 on mobile; characters cast real shadows). Desktop always uses 2 cascades
; (AAbyssZoneActor::ApplyQuality). Child profiles (GPU-family Android profiles, individual iPhones / iPads) inherit these
; through BaseProfileName.

[Android_Low DeviceProfile]
+CVars=abyss.Quality=0
+CVars=r.Shadow.CSM.MaxMobileCascades=0
+CVars=r.MSAACount=2
+CVars=t.MaxFPS=30

[Android_Mid DeviceProfile]
+CVars=abyss.Quality=1
+CVars=r.Shadow.CSM.MaxMobileCascades=0
+CVars=t.MaxFPS=60

[Android_High DeviceProfile]
+CVars=abyss.Quality=2
+CVars=r.Shadow.CSM.MaxMobileCascades=1
+CVars=r.Shadow.MaxCSMResolution=2048
+CVars=t.MaxFPS=60

[IOS DeviceProfile]
+CVars=abyss.Quality=1
+CVars=r.Shadow.CSM.MaxMobileCascades=0

