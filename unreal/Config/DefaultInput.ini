; Abyssfire - input configuration (ue58-platform.md 5.2). Enhanced Input objects are created at runtime in C++ (8.1);
; no legacy ActionMappings / AxisMappings.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; Our own Slate touch layer replaces the engine's virtual joysticks (8.3).
DefaultTouchInterface=None
bAlwaysShowTouchInterface=False
bUseMouseForTouch=False
bEnableMouseSmoothing=False
bEnableFOVScaling=False
bEnableGestureRecognizer=False
; Hold-to-move keeps working when the cursor leaves the window while held.
DefaultViewportMouseCaptureMode=CaptureDuringMouseDown
DefaultViewportMouseLockMode=DoNotLock
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True
bShowConsoleOnFourFingerTap=False

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
bEnableUserSettings=False
