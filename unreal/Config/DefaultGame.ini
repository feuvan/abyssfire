; Abyssfire - game / packaging configuration (ue58-platform.md 5.3).

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Abyssfire
ProjectVersion=0.1.0
CompanyName=feuvan
bAllowWindowResize=True
bShouldWindowPreserveAspectRatio=False

[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Shipping
UsePakFile=True
bUseIoStore=True
bCompressed=True
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=True
bSkipEditorContent=True
IncludePrerequisites=True
+MapsToCook=(FilePath="/Game/Abyssfire/Maps/L_Main")
; Mandatory: meshes / anims / materials / textures / sounds are loaded by path from the art and data manifests at
; runtime; no map references them (ue58-platform.md 10.3).
+DirectoriesToAlwaysCook=(Path="/Game/Abyssfire")
; CJK ICU data for Slate line breaking (the game uses its own string tables, not UE localisation).
InternationalizationPreset=All
+CulturesToStage=en
+CulturesToStage=zh-Hans
+CulturesToStage=zh-Hant
