; Abyssfire - engine configuration (ue58-platform.md 5.1; DECISIONS P1-P12).
; Keys marked [Verify] are listed in ue58-platform.md 17 and must be confirmed on the first UE 5.8.3 install.

[/Script/EngineSettings.GameMapsSettings]
; L_Main is created by Scripts/build_content.py (ue58-platform.md 11.7); the game builds every zone at runtime (P9).
GameDefaultMap=/Game/Abyssfire/Maps/L_Main.L_Main
EditorStartupMap=/Game/Abyssfire/Maps/L_Main.L_Main
GlobalDefaultGameMode=/Script/Abyssfire.AbyssGameMode
GameInstanceClass=/Script/Abyssfire.AbyssGameInstance

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Mobile
AppliedTargetedHardwareClass=Mobile
DefaultGraphicsPerformance=Scalable
AppliedDefaultGraphicsPerformance=Scalable

[/Script/Engine.RendererSettings]
; --- feature set: no GI / reflections / virtual shadows / Nanite / RT / distance fields / static lighting (6.1)
r.Substrate=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.Nanite.ProjectEnabled=False
r.RayTracing=False
r.Lumen.HardwareRayTracing=False
r.AllowStaticLighting=False
r.VirtualTextures=False
r.SkinCache.CompileShaders=False
r.SupportSkyAtmosphere=False
r.SupportSkyAtmosphereAffectsHeightFog=False
; --- shader permutation trimming (all-dynamic lighting)
r.SupportStationarySkylight=False
r.SupportLowQualityLightmaps=False
r.SupportPointLightWholeSceneShadows=False
r.SupportAllShaderPermutations=False
; --- desktop path: deferred + TSR (P2; forward + MSAA renders no meshes on M1/M2 in 5.8.0/5.8.1)
r.ForwardShading=False
r.AntiAliasingMethod=4
r.CustomDepth=3
; --- post-process defaults (the zone post-process volume sets the rest, 6.7)
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=2
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.DefaultFeature.LensFlare=False
; --- mobile path: forward + MSAA 4x + MobileHDR (P3). [Verify] 0 = forward in 5.8 (toggle once and diff).
r.Mobile.ShadingPath=0
r.Mobile.AntiAliasing=3
r.MSAACount=4
r.MobileHDR=True
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.EnableMovablePointLightsShadows=False
r.Mobile.AllowDitheredLODTransition=False
r.Mobile.SupportGPUScene=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM6
+D3D12TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/MacTargetPlatform.MacTargetSettings]
; Apple Silicon only (5.8 removed Intel-Mac rendering); SM5 because Metal SM6 needs macOS 15+.
-TargetedRHIs=SF_METAL_SM6
+TargetedRHIs=SF_METAL_SM5

[/Script/MacTargetPlatform.XcodeProjectSettings]
; Modern Xcode signing (5.4+). DECISIONS P12: bundle id com.feuvan.abyssfire on every platform.
bUseModernXcode=True
bUseAutomaticCodeSigning=True
; TODO(user, P12): your Apple Developer team id (10 characters, Xcode -> Settings -> Accounts). Required to build for
; iOS devices and to sign / notarize the Mac app. Left empty on purpose: never commit someone else's team id.
CodeSigningTeam=
CodeSigningPrefix=com.feuvan
BundleIdentifier=com.feuvan.abyssfire
ApplicationDisplayName=Abyssfire
AppCategory=public.app-category.role-playing-games

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
BundleDisplayName=Abyssfire
BundleName=abyssfire
BundleIdentifier=com.feuvan.abyssfire
; [Verify] enum spelling in 5.8 (IOS_17 exists in 5.6).
MinimumiOSVersion=IOS_17
bSupportsIPad=True
bSupportsIPhone=True
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
PreferredLandscapeOrientation=LandscapeLeft
bSupportsMetal=True
bSupportsMetalMRT=False
FrameRateLock=PUFRL_60
bSupportHighRefreshRates=False
bAutomaticSigning=True
; TODO(user, P12): same Apple team id as CodeSigningTeam above (legacy signing path).
IOSTeamID=
bEnableCloudKitSupport=False
bEnableRemoteNotificationsSupport=False
bEnableGameCenterSupport=False
bEnableAdvertisingIdentifier=False

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=com.feuvan.abyssfire
StoreVersion=1
VersionDisplayName=0.1.0
MinSDKVersion=26
TargetSDKVersion=36
Orientation=SensorLandscape
bFullScreen=True
bUseDisplayCutout=True
bBuildForArm64=True
bBuildForX8664=False
bSupportsVulkan=True
; [Verify] GLES 3.2 fallback still offered in 5.8 (Q14).
bBuildForES31=True
bPackageDataInsideApk=True
bEnableBundle=True
bEnableUniversalAPK=False
bEnableGooglePlaySupport=False
bMultiTargetFormat_ASTC=True
bMultiTargetFormat_ETC2=False
bMultiTargetFormat_DXT=False
; TODO(user, P12): Play distribution signing. Set KeyStore (file name under Build/Android/), KeyAlias, KeyStorePassword
; and KeyPassword in Config/Android/AndroidEngine.ini on the build machine or pass them to UAT - never commit the
; keystore or its passwords. Development builds are signed with the debug key automatically.

[/Script/Engine.UserInterfaceSettings]
; Slate ScaleToFit at the web's 1280x720 design size (P4, ue58-platform.md 9.2).
UIScaleRule=ScaleToFit
DesignScreenSize=(X=1280,Y=720)
ApplicationScale=1.0
bAllowHighDPIInGameMode=True
RenderFocusRule=NavigationOnly

[/Script/Engine.Engine]
bSmoothFrameRate=False
bUseFixedFrameRate=False
